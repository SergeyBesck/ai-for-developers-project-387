```yaml
name: OpenCode PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Automated Code Review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run OpenCode Review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/minimax-m2.5
          prompt: |
            Review this pull request as a careful senior software engineer.

            Analyze the changes in the current pull request and identify
            concrete bugs, regressions, security risks, and missing tests.

            Review criteria:
            1. Correctness: look for incorrect logic, edge cases, and failures.
            2. Security: identify vulnerabilities and unsafe handling of input.
            3. Compatibility: check for regressions and breaking changes.
            4. Tests: identify missing tests for important behavior.
            5. Maintainability: flag only meaningful problems that should
               be fixed before merging.

            Instructions:
            - Focus on issues introduced by this pull request.
            - Do not report purely stylistic preferences as bugs.
            - Do not invent problems; verify findings against the code.
            - For each finding, explain the problem and its impact.
            - Provide a specific, actionable recommendation.
            - If no actionable issues are found, say so explicitly.
            - Do not modify files or commit changes.
            - Publish the review findings on this pull request.
```
