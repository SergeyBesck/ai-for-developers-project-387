name: OpenCode PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Automated Code Review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run OpenCode Review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/mimo-v2.6-flash-free
          prompt: |
            Review the changes introduced by this pull request.

            Check for:
            - Bugs and incorrect logic.
            - Security vulnerabilities.
            - Regressions and compatibility issues.
            - Missing tests for important behavior.

            Focus on concrete issues introduced by this pull request.
            Explain the impact and provide actionable recommendations.
            Publish findings on this pull request.
            Do not modify files or create commits.

            Do not inspect other GitHub Actions runs.
            Do not poll workflow statuses or wait for workflows.
            Do not investigate branch protection or repository settings.
            Finish after publishing the review.
