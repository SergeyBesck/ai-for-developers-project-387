name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Automated Code Review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode Review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/mimo-v2.6-flash-free
          use_github_token: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }}.

            Get the changes with: gh pr diff ${{ github.event.pull_request.number }}
            Read the changed files and only as much surrounding code as you
            need to confirm a finding.

            Review criteria:
            1. Bugs and obvious logic errors.
            2. Code style and consistency with the surrounding code.
            3. Wrong or missing types, unchecked input, unhandled errors.
            4. Security problems (injection, XSS, leaked secrets).
            5. Changed behavior without tests.

            Output: post one comment on the pull request, written in Russian.
            For each finding give the file, line, the problem and a suggested
            fix. Report only issues you verified in the diff. If there are
            none, say that no actionable issues were found and summarize the
            change in one sentence.

            This is a read-only review: do not modify files or create
            commits. Stop right after posting the comment.
