name: OpenCode PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Automated Code Review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run OpenCode Review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/mimo-v2.6-flash-free
          prompt: |
            Review the changes introduced by this pull request.

            Review for:
            1. Bugs, incorrect logic, and unhandled edge cases.
            2. Security vulnerabilities.
            3. Regressions and compatibility issues.
            4. Missing tests for important behavior.
            5. Maintainability problems that could cause real defects.

            Requirements:
            - Focus on issues introduced by this pull request.
            - Inspect the diff and relevant surrounding code.
            - Report only concrete, actionable findings.
            - Explain the impact of each finding.
            - Include the relevant changed lines when possible.
            - Do not invent issues or report stylistic preferences.
            - If no actionable issues are found, state that clearly.
            - Publish review findings on this pull request.
            - Do not modify files, create commits, or push changes.

            Execution restrictions:
            - Do not inspect other GitHub Actions runs or their logs.
            - Do not use `gh run view` or poll workflow statuses.
            - Do not wait for this or any other workflow to complete.
            - Do not use sleep commands or polling loops.
            - Do not investigate branch protection or repository settings.
            - Do not attempt to merge the pull request.
            - Complete the review and stop.
