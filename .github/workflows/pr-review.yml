name: OpenCode PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Automated Code Review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run OpenCode Review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/mimo-v2.6-flash-free
          prompt: |
            Review pull request #${{ github.event.pull_request.number }}.
          
            Your only task is to review the pull request diff and publish
            actionable review findings.
          
            Follow these steps:
            1. Read the pull request diff.
            2. Inspect only the changed files and the surrounding code needed
               to verify potential issues.
            3. Identify concrete bugs, security vulnerabilities, regressions,
               and missing tests.
            4. Publish the findings on the pull request.
            5. Finish immediately.
          
            Strict restrictions:
            - Do not inspect git history or run git log.
            - Do not inspect release-please configuration or release manifests
              unless they are changed in this pull request.
            - Do not inspect unrelated workflow files.
            - Do not query PR mergeability, review decisions, or CI status.
            - Do not inspect other workflow runs or their logs.
            - Do not modify files, create commits, or push changes.
            - Do not wait, poll, retry indefinitely, or use sleep.
            - Do not investigate repository settings.
            - Report only verified, actionable issues.
            - If no issues are found, explicitly report that no actionable
              issues were identified.
